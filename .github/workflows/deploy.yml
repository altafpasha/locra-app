name: 🚀 Build & Deploy Locra AI (Production)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. Validation & Build Test
  # ============================================================================
  build-and-test:
    name: 🧪 Validate & Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Application (Standalone Verification)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

  # ============================================================================
  # 2. Remote Deployment via SSH to Dokploy / Traefik Host
  # ============================================================================
  deploy:
    name: 🚢 Deploy to Production Server
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔐 Execute Remote Deployment over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          TRAVEL_AI_API_KEY: ${{ secrets.TRAVEL_AI_API_KEY }}
          TRAVEL_AI_API_URL: ${{ secrets.TRAVEL_AI_API_URL || 'https://travel-api.codesec.me' }}
          REPO_AUTH_URL: "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          REPO_CLEAN_URL: "https://github.com/${{ github.repository }}.git"
          BRANCH: ${{ github.ref_name }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DEPLOY_PATH,TRAVEL_AI_API_KEY,TRAVEL_AI_API_URL,REPO_AUTH_URL,REPO_CLEAN_URL,BRANCH
          script_stop: true
          script: |
            echo "=================================================="
            echo "🚀 Starting Locra AI Deployment on $(hostname)"
            echo "👤 User: $(whoami) | Home: $HOME | PWD: $(pwd)"
            echo "=================================================="

            # 1. Determine and prepare target directory
            if [ -n "$DEPLOY_PATH" ]; then
              TARGET_DIR="$DEPLOY_PATH"
            else
              TARGET_DIR="$HOME/locra_app"
            fi
            echo "📂 Target Directory: $TARGET_DIR"

            mkdir -p "$TARGET_DIR" 2>/dev/null || sudo mkdir -p "$TARGET_DIR" 2>/dev/null || true
            sudo chown -R $(whoami):$(whoami) "$TARGET_DIR" 2>/dev/null || true
            cd "$TARGET_DIR"
            echo "📍 Current working directory: $(pwd)"

            # 2. Git Fetch and Sync with Token Authentication
            echo "🔄 Synchronizing codebase from GitHub..."
            if [ -d ".git" ]; then
              echo "🔄 Updating existing Git repository..."
              git remote set-url origin "$REPO_AUTH_URL" 2>/dev/null || true
              git fetch origin "$BRANCH"
              git reset --hard "origin/$BRANCH"
            else
              echo "📥 Initializing and cloning Git repository..."
              git init
              git remote add origin "$REPO_AUTH_URL" 2>/dev/null || git remote set-url origin "$REPO_AUTH_URL" 2>/dev/null || true
              git fetch origin "$BRANCH"
              git checkout -f -B "$BRANCH" "origin/$BRANCH"
            fi

            # Clean token from git config after sync
            git remote set-url origin "$REPO_CLEAN_URL" 2>/dev/null || true
            echo "✅ Codebase updated to latest commit."

            # 3. Write Production Environment Configuration
            echo "⚙️ Writing .env configuration..."
            printf "NODE_ENV=production\nPORT=3000\nTRAVEL_AI_API_KEY=%s\nTRAVEL_AI_API_URL=%s\n" "$TRAVEL_AI_API_KEY" "$TRAVEL_AI_API_URL" > .env

            # 4. Check Docker Permissions and Compose Command
            if docker ps >/dev/null 2>&1; then
              DOCKER_BIN="docker"
            elif sudo docker ps >/dev/null 2>&1; then
              DOCKER_BIN="sudo docker"
            else
              echo "❌ Error: Docker is not accessible for user $(whoami)"
              exit 1
            fi
            echo "🐳 Using Docker command: $DOCKER_BIN"

            # 5. Ensure Dokploy / Traefik Network
            echo "🌐 Checking Docker network 'dokploy-network'..."
            $DOCKER_BIN network inspect dokploy-network >/dev/null 2>&1 || $DOCKER_BIN network create dokploy-network 2>/dev/null || true

            # 6. Build and Launch Containers
            echo "🚀 Launching containers with Docker Compose..."
            $DOCKER_BIN compose -f docker-compose.prod.yml up -d --build --remove-orphans

            # 7. Prune dangling images
            echo "🧹 Cleaning up old unused images..."
            $DOCKER_BIN image prune -f || true

            # 8. Verification Output
            echo "✅ Container status:"
            $DOCKER_BIN ps --filter "name=locra-app"

            echo "=================================================="
            echo "🎉 Locra AI successfully deployed to:"
            echo "   👉 https://locra.app"
            echo "   👉 https://www.locra.app"
            echo "=================================================="
