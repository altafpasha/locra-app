name: 🚀 Build & Deploy Locra AI (Production)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. Validation & Build Test
  # ============================================================================
  build-and-test:
    name: 🧪 Validate & Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Application (Standalone Verification)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

  # ============================================================================
  # 2. Remote Deployment via SSH to Dokploy / Traefik Host
  # ============================================================================
  deploy:
    name: 🚢 Deploy to Production Server
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔐 Execute Remote Deployment over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/home/codesec/locra_app' }}
          TRAVEL_AI_API_KEY: ${{ secrets.TRAVEL_AI_API_KEY }}
          TRAVEL_AI_API_URL: ${{ secrets.TRAVEL_AI_API_URL || 'https://travel-api.codesec.me' }}
          REPO_URL: "https://github.com/${{ github.repository }}.git"
          BRANCH: ${{ github.ref_name }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DEPLOY_PATH,TRAVEL_AI_API_KEY,TRAVEL_AI_API_URL,REPO_URL,BRANCH
          script_stop: true
          script: |
            set -e
            echo "🚀 Starting Locra AI deployment on $(hostname)..."
            
            TARGET_DIR="${DEPLOY_PATH:-/home/codesec/locra_app}"
            echo "📂 Deploy directory: $TARGET_DIR"
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"
            
            if [ -d ".git" ]; then
              echo "🔄 Updating existing Git repository..."
              git remote set-url origin "$REPO_URL" 2>/dev/null || true
              git fetch origin "$BRANCH"
              git reset --hard "origin/$BRANCH"
            else
              echo "📥 Initializing and fetching Git repository..."
              git init
              git remote add origin "$REPO_URL" 2>/dev/null || git remote set-url origin "$REPO_URL"
              git fetch origin "$BRANCH"
              git checkout -f -B "$BRANCH" "origin/$BRANCH"
            fi
            
            echo "⚙️ Writing production .env configuration..."
            printf "NODE_ENV=production\nPORT=3000\nTRAVEL_AI_API_KEY=%s\nTRAVEL_AI_API_URL=%s\n" "$TRAVEL_AI_API_KEY" "$TRAVEL_AI_API_URL" > .env
            
            echo "🌐 Ensuring Docker network 'dokploy-network'..."
            docker network inspect dokploy-network >/dev/null 2>&1 || docker network create dokploy-network || true
            
            echo "🐳 Building and starting Docker container with Traefik..."
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            
            echo "🧹 Cleaning up dangling images..."
            docker image prune -f || true
            
            echo "✅ Container status:"
            docker ps --filter "name=locra-app"
            
            echo "🎉 Locra AI successfully deployed to https://locra.app and https://www.locra.app!"
