# ==============================================================================
# Locra AI — Production Compose
# Image is built in CI and pulled from GHCR; this host never builds.
# Routing is handled by Dokploy's Traefik v3 instance on `dokploy-network`.
# ==============================================================================

services:
  locra-app:
    image: ${LOCRA_IMAGE:-ghcr.io/altafpasha/locra-app:latest}
    container_name: locra-app
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - TRAVEL_AI_API_KEY=${TRAVEL_AI_API_KEY}
      - TRAVEL_AI_API_URL=${TRAVEL_AI_API_URL:-https://travel-api.codesec.me}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dokploy-network
      - internal-net
    labels:
      # Enable Traefik for this service
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"

      # ----------------- HTTP (Port 80) -> Redirect to HTTPS -----------------
      - "traefik.http.routers.locra-http.rule=Host(`locra.app`) || Host(`www.locra.app`)"
      - "traefik.http.routers.locra-http.entrypoints=web"
      - "traefik.http.routers.locra-http.middlewares=locra-https-redirect"
      - "traefik.http.middlewares.locra-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.locra-https-redirect.redirectscheme.permanent=true"

      # ----------------- HTTPS (Port 443) -> TLS & Let's Encrypt -----------------
      - "traefik.http.routers.locra-https.rule=Host(`locra.app`) || Host(`www.locra.app`)"
      - "traefik.http.routers.locra-https.entrypoints=websecure"
      - "traefik.http.routers.locra-https.tls=true"
      - "traefik.http.routers.locra-https.tls.certresolver=letsencrypt"

      # ----------------- Internal Load Balancer Port -----------------
      - "traefik.http.services.locra-service.loadbalancer.server.port=3000"

networks:
  dokploy-network:
    external: true
  internal-net:
    driver: bridge
